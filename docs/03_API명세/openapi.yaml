  # ==================== ViewingPlan ====================
  /viewing-plans:
    post:
      x-scope: 확장
      tags: [ViewingPlan]
      summary: 관람 계획 생성
      description: |
        REQ-F-401, REQ-F-402. 목표와 제약 조건을 저장한다.
        시즌당 1개만 유지하며, 같은 시즌 계획이 있으면 교체한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seasonYear, targetCount]
              properties:
                seasonYear: { type: integer, example: 2026 }
                targetCount: { type: integer, minimum: 1, maximum: 144, example: 20 }
                budgetTotal: { type: integer, nullable: true, example: 600000 }
                maxCostPerGame: { type: integer, nullable: true, example: 40000 }
                availableDays:
                  type: array
                  nullable: true
                  description: 미지정 시 요일 제약 없음
                  items: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
                stadiumIds:
                  type: array
                  nullable: true
                  description: 미지정 시 전 구장
                  items: { type: integer, format: int64 }
                maxPrecipProb:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 100
                  description: 이 값을 초과하는 강수 확률의 경기는 제외 (REQ-F-402)
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  planId: { type: integer, format: int64 }

