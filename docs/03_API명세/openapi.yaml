    get:
      x-scope: MVP
      tags: [AttendanceLog]
      summary: 기록 상세 조회
      description: REQ-F-214, REQ-NF-008. 비공개 기록은 작성자만 조회할 수 있다.
      parameters:
        - { $ref: '#/components/parameters/LogId' }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceLogDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      x-scope: MVP
      tags: [AttendanceLog]
      summary: 기록 수정
      description: |
        > **현재 미구현.** 기록 수정 화면과 함께 다음 범위로 미뤘다.
        > 잘못 쓴 기록은 삭제 후 다시 작성해 대체할 수 있다.

        REQ-F-212. 수정 후 전적을 재집계한다.
      parameters:
        - { $ref: '#/components/parameters/LogId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceLogRequest' }
      responses:
        '200':
          description: 수정 성공
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      x-scope: MVP
      tags: [AttendanceLog]
      summary: 기록 삭제
      description: REQ-F-212. 삭제 후 전적을 재집계한다.
      parameters:
        - { $ref: '#/components/parameters/LogId' }
      responses:
        '204':
          description: 삭제 성공
        '403': { $ref: '#/components/responses/Forbidden' }

  /attendance-logs/{logId}/photos:
    post:
      x-scope: MVP
      tags: [AttendanceLog]
      summary: 사진 업로드
      description: |
        REQ-F-203. 기록당 최대 10장, 1장당 10MB 이하.
        서버는 저장 전에 **위치 메타데이터를 제거하고**(REQ-NF-007) 썸네일을 생성한다(REQ-NF-002).
        일부 파일이 실패해도 나머지는 정상 처리하며, 실패 목록을 응답에 포함한다.
      parameters:
        - { $ref: '#/components/parameters/LogId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201':
          description: 업로드 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploaded:
                    type: array
                    items: { $ref: '#/components/schemas/PhotoResponse' }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        fileName: { type: string }
                        reason: { type: string, example: FILE_TOO_LARGE }
        '413':
          description: 전체 파일이 허용 용량을 초과함

