      summary: 후보 일정 자동 편성
      description: |
        REQ-F-403.

        **처리 방식** — 제약을 만족하는 경기를 걸러낸 뒤 우선순위로 정렬해 목표 수만큼 고른다.
        요일·구장·날씨·경기당 예산은 경기 단위로 독립 판정되므로 조합 최적화가 필요하지 않다.
        경기 간 상호작용이 있는 제약(총 예산, 같은 날 중복)은 순차 선택 과정에서 처리한다.

        **우선순위** — ① 응원팀 경기 ② 과거 승률이 높았던 구장 ③ 이른 날짜

        **경기당 예상 비용** — 사용자의 과거 관람 기록에서 구장별 평균 지출을 사용한다.
        기록이 없으면 기본값을 적용한다.

        **목표 미달 시** — 제약을 하나씩 풀어 몇 경기가 더 확보되는지 계산해 완화 후보로 제시한다.
        "조건에 맞는 경기가 없습니다"로 끝내면 사용자가 무엇을 바꿔야 할지 알 수 없기 때문이다.
      parameters:
        - { name: planId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                stadiumIds:
                  type: array
                  nullable: true
                  items: { type: integer, format: int64 }
      responses:
        '200':
          description: 편성 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  targetCount: { type: integer, example: 20 }
                  fulfilledCount: { type: integer, example: 4 }
                  estimatedCost: { type: integer, example: 120000 }
                  proposed:
                    type: array
                    items:
                      type: object
                      properties:
                        gameId: { type: integer, format: int64 }
                        gameDate: { type: string, format: date }
                        dayOfWeek: { type: string, example: 토 }
                        startTime: { type: string, example: "17:00" }
                        stadium: { type: string, example: 잠실야구장 }
                        matchup: { type: string, example: LG vs 두산 }
                        cheerTeamGame: { type: boolean }
                        precipProbability: { type: integer, nullable: true }
                        estimatedCost: { type: integer }
                  filteredOut:
                    type: array
                    description: 제약별 제외 경기 수. 편성 결과의 근거를 보여준다
                    items:
                      type: object
                      properties:
                        constraint: { type: string, example: AVAILABLE_DAYS }
                        label: { type: string, example: 관람 가능 요일 }
                        excluded: { type: integer, example: 60 }
                  unsatisfied:
                    type: array
                    description: 목표 미달 시 완화 후보
                    items:
                      type: object
                      properties:
                        constraint: { type: string, example: AVAILABLE_DAYS }
                        message: { type: string, example: 월·화·수·목·금요일을 추가하면 최대 15경기까지 채울 수 있어요 }
                        additionalGames: { type: integer, example: 11 }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ==================== Admin ====================
  /admin/games:
    post:
      x-scope: MVP
      tags: [Admin]
      summary: 경기 등록
      description: REQ-F-601, REQ-NF-009. 운영자 권한이 필요하다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameUpsertRequest' }
      responses:
        '201':
          description: 등록 성공
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/games/unconfirmed:
    get:
      x-scope: MVP
      tags: [Admin]
      summary: 결과 미등록 경기 조회
      description: |
        REQ-F-606. 이미 시작했는데 결과가 등록되지 않은 경기를 조회한다.
        경기 결과는 운영자만 등록·정정하므로(REQ-NF-015) 이 목록이 곧 등록 누락 목록이다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    game: { $ref: '#/components/schemas/GameResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/games/{gameId}/revisions:
    post:
      x-scope: MVP
      tags: [Admin]
      summary: 경기 결과 정정
      description: |
        REQ-F-602, REQ-F-603, REQ-F-309.

        정정 사유는 필수이며, 변경 전후 값이 `game_revisions`에 추가 전용으로 기록된다.
        정정 후 해당 경기를 기록한 **모든 사용자**의 전적을 재집계하고 알림을 발송한다 (REQ-F-604).
      parameters:
        - { name: gameId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                status:
                  type: string
                  enum: [SCHEDULED, IN_PROGRESS, FINISHED, CANCELED, SUSPENDED]
                homeScore: { type: integer }
                awayScore: { type: integer }
                reason:
                  type: string
                  maxLength: 255
                  example: 우천 노게임 처리
      responses:
        '200':
          description: 정정 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisionId: { type: integer, format: int64 }
                  affectedUserCount:
                    type: integer
                    description: 전적이 재계산된 사용자 수
                    example: 37
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      x-scope: MVP
      tags: [Admin]
      summary: 경기 정정 이력 조회
      description: REQ-F-603. 이력은 추가 전용이므로 조회만 제공한다.
      parameters:
        - { name: gameId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GameRevisionResponse' }


  /admin/stadiums/{stadiumId}:
    patch:
      x-scope: MVP
      tags: [Admin]
      summary: 구장 정보 수정
      description: |
        REQ-F-605. 구장은 관람 기록과 기상청 격자가 함께 걸려 있어 삭제 없이 수정만 제공한다.
        보내지 않은 항목은 변경하지 않는다.
      parameters:
        - { name: stadiumId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address: { type: string, maxLength: 255 }
                capacity: { type: integer }
                gridNx: { type: integer, description: 기상청 단기예보 격자 X }
                gridNy: { type: integer, description: 기상청 단기예보 격자 Y }
      responses:
        '200':
          description: 수정 성공
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/stadiums/{stadiumId}/zones:
    get:
      x-scope: MVP
      tags: [Admin]
      summary: 좌석 구역 목록 (운영자)
      description: |
        REQ-F-605. 비활성 구역도 함께 반환한다. 운영자는 되살릴 수 있어야 하기 때문이다.
        구역별 관람 기록 건수를 함께 주어, 비활성화·삭제 전에 영향 범위를 확인하게 한다.
      parameters:
        - { name: stadiumId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    name: { type: string, example: 1루 응원 지정석 }
                    sortOrder: { type: integer }
                    active: { type: boolean }
                    logCount: { type: integer, description: 이 구역을 좌석으로 기록한 관람 건수 }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      x-scope: MVP
      tags: [Admin]
      summary: 좌석 구역 추가
      description: REQ-F-605. 같은 구장 안에서 이름이 중복될 수 없다.
      parameters:
        - { name: stadiumId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 50, example: 1루 응원 지정석 }
                sortOrder: { type: integer, description: 생략하면 맨 뒤에 붙는다 }
      responses:
        '201':
          description: 추가 성공
        '400':
          description: 이름 누락 (ZONE_NAME_REQUIRED)
        '409':
          description: 같은 구장에 같은 이름이 이미 있음 (DUPLICATE_ZONE)
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/zones/{zoneId}:
    patch:
      x-scope: MVP
      tags: [Admin]
      summary: 좌석 구역 수정 · 비활성화
      description: |
        REQ-F-605. `active=false` 로 두면 일반 조회(`GET /stadiums/{stadiumId}`)에서 제외되고
        새 관람 기록에서도 선택할 수 없다. 이미 그 구역으로 남긴 기록과 만족도 집계는 유지된다.
      parameters:
        - { name: zoneId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 50 }
                sortOrder: { type: integer }
                active: { type: boolean }
      responses:
        '200':
          description: 수정 성공
        '409':
          description: 이름 중복 (DUPLICATE_ZONE)
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      x-scope: MVP
      tags: [Admin]
      summary: 좌석 구역 삭제
      description: |
        REQ-F-605. **관람 기록이 하나도 없는 구역만 삭제할 수 있다.**
        기록이 딸린 구역을 지우면 과거 기록의 좌석 정보와 그 구역에 쌓인 만족도 평가가
        함께 사라지므로, 그런 구역은 비활성화로 처리한다.
      parameters:
        - { name: zoneId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204':
          description: 삭제 성공
        '409':
          description: 관람 기록이 있어 삭제 불가 (ZONE_IN_USE)
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    LogId:
      name: logId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PostId:
      name: postId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: 요청 값이 올바르지 않음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: 인증 필요 또는 토큰 만료
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 권한 없음 (REQ-NF-008, REQ-NF-009)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 대상을 찾을 수 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      properties:
        code: { type: string, example: INVALID_CREDENTIALS }
        message: { type: string, example: 이메일 또는 비밀번호가 올바르지 않습니다. }
        data: { type: object, nullable: true }

    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 3600 }

    UserResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        nickname: { type: string }
        profileImageUrl: { type: string, nullable: true }
        favoriteTeam: { $ref: '#/components/schemas/TeamResponse' }
        attendanceCount: { type: integer, example: 12 }

    TeamResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: 두산 베어스 }
        shortName: { type: string, example: 두산 }
        logoUrl: { type: string, nullable: true }
        channels: { $ref: '#/components/schemas/TeamChannels' }

    GameResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        seasonYear: { type: integer, example: 2026 }
        gameDate: { type: string, format: date }
        startAt: { type: string, format: date-time }
        stadium: { $ref: '#/components/schemas/StadiumResponse' }
        homeTeam: { $ref: '#/components/schemas/TeamResponse' }
        awayTeam: { $ref: '#/components/schemas/TeamResponse' }
        homeScore: { type: integer, nullable: true }
        awayScore: { type: integer, nullable: true }
        status:
          type: string
          enum: [SCHEDULED, IN_PROGRESS, FINISHED, CANCELED, SUSPENDED]
        resultConfirmed:
          type: boolean
          description: REQ-F-606. false 이면 화면에 "확인 중" 배지를 표시하고 전적 집계에서 제외한다
          example: true

    StandingResponse:
      type: object
      description: 등록된 경기 결과로부터 산출 (REQ-F-104)
      properties:
        rank: { type: integer, example: 1 }
        team: { $ref: '#/components/schemas/TeamResponse' }
        games: { type: integer }
        wins: { type: integer }
        draws: { type: integer }
        losses: { type: integer }
        winRate: { type: number, format: float, example: 0.636 }
        gamesBehind: { type: number, format: float, example: 0.0 }

    WeatherResponse:
      type: object
      properties:
        temperature: { type: number, format: float, nullable: true, example: 27.4 }
        sky: { type: string, nullable: true, example: 구름많음 }
        precipType: { type: string, nullable: true, example: 없음 }
        precipProbability: { type: integer, nullable: true, example: 30 }
        alert:
          type: string
          nullable: true
          description: REQ-F-113 기상특보 발효 시
          example: 호우주의보
        rainRisk:
          type: boolean
          description: 강수 확률이 기준 이상이거나 특보 발효 중이면 true
        fetchedAt: { type: string, format: date-time }
        dataSource:
          type: string
          description: REQ-NF-024 출처 표기
          example: 기상청 단기예보 (공공데이터포털, 공공누리 출처표시)

    TeamChannels:
      type: object
      description: REQ-F-114 구단 공식 채널
      properties:
        homepageUrl: { type: string, nullable: true }
        ticketUrl: { type: string, nullable: true }
        instagramUrl: { type: string, nullable: true }
        youtubeUrl: { type: string, nullable: true }

    StadiumResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: 잠실야구장 }
        address: { type: string }
        capacity: { type: integer, example: 25000 }

    StadiumDetailResponse:
      allOf:
        - $ref: '#/components/schemas/StadiumResponse'
        - type: object
          properties:
            homeTeams:
              type: array
              items: { $ref: '#/components/schemas/TeamResponse' }
            zones:
              type: array
              items: { $ref: '#/components/schemas/ZoneStatResponse' }
            myRecord:
              type: object
              nullable: true
              description: 로그인 사용자의 해당 구장 전적
              properties:
                games: { type: integer }
                wins: { type: integer }
                draws: { type: integer }
                losses: { type: integer }

    ZoneStatResponse:
      type: object
      properties:
        zoneId: { type: integer, format: int64 }
        name: { type: string, example: 3루 내야 지정석 }
        avgRating:
          type: number
          format: float
          nullable: true
          description: 표본 5건 미만이면 null (REQ-F-305)
          example: 4.2
        ratingCount: { type: integer, example: 87 }
        smallSample: { type: boolean, example: false }

    AttendanceLogRequest:
      type: object
      required: [gameId, stadiumZoneId, zoneRating]
      properties:
        gameId: { type: integer, format: int64 }
        cheerTeamId:
          type: integer
          format: int64
          nullable: true
          description: null 이면 중립 관람 (승패 집계 제외)
        stadiumZoneId: { type: integer, format: int64 }
        zoneRating: { type: integer, minimum: 1, maximum: 5, description: 필수 (REQ-F-206) }
        memo: { type: string, maxLength: 1000 }
        gameRating: { type: integer, minimum: 1, maximum: 5, nullable: true }
        ticketCost: { type: integer, minimum: 0, nullable: true }
        foodCost: { type: integer, minimum: 0, nullable: true }
        transportCost: { type: integer, minimum: 0, nullable: true }
        visibility: { type: string, enum: [PUBLIC, PRIVATE], default: PRIVATE }
        companions:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              userId: { type: integer, format: int64, nullable: true }
              name: { type: string, nullable: true, description: 비회원인 경우 }

    AttendanceLogSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        gameDate: { type: string, format: date }
        stadiumName: { type: string }
        matchup: { type: string, example: '두산 5 : 3 롯데' }
        result: { type: string, enum: [WIN, DRAW, LOSE, NEUTRAL] }
        thumbnailUrl: { type: string, nullable: true }

    AttendanceLogDetail:
      allOf:
        - $ref: '#/components/schemas/AttendanceLogSummary'
        - type: object
          properties:
            game: { $ref: '#/components/schemas/GameResponse' }
            zoneName: { type: string }
            zoneRating: { type: integer }
            memo: { type: string, nullable: true }
            gameRating: { type: integer, nullable: true }
            totalCost: { type: integer, nullable: true }
            visibility: { type: string, enum: [PUBLIC, PRIVATE] }
            photos:
              type: array
              items: { $ref: '#/components/schemas/PhotoResponse' }

    PhotoResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        originalUrl: { type: string }
        thumbnailUrl: { type: string }
        takenAt: { type: string, format: date-time, nullable: true }

    StatSummaryResponse:
      type: object
      properties:
        seasonYear: { type: integer, nullable: true, description: null 이면 통산 }
        games: { type: integer, example: 12 }
        wins: { type: integer, example: 7 }
        draws: { type: integer, example: 1 }
        losses: { type: integer, example: 4 }
        winRate:
          type: number
          format: float
          nullable: true
          description: 표본 5경기 미만이면 null (REQ-F-305)
          example: 0.636
        smallSample: { type: boolean, example: false }
        neutralCount: { type: integer, description: '승패 집계에서 제외된 중립 관람 수', example: 1 }
        currentStreak: { type: integer, description: '양수는 연승, 음수는 연패', example: 2 }
        longestWinStreak: { type: integer, example: 4 }
        totalCost: { type: integer, nullable: true, example: 312000 }

    StatItem:
      type: object
      properties:
        key: { type: string, example: '1' }
        label: { type: string, example: 잠실야구장 }
        games: { type: integer }
        wins: { type: integer }
        draws: { type: integer }
        losses: { type: integer }
        winRate: { type: number, format: float, nullable: true }
        smallSample: { type: boolean }

    CommentResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }

    MessageResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        isMine: { type: boolean }

    BadgeResponse:
      type: object
      properties:
        code: { type: string, example: FIRST_LOG }
        name: { type: string, example: 첫 직관 }
        description: { type: string, example: 첫 관람 기록을 남겼어요 }
        iconUrl: { type: string, nullable: true }
        achievedAt: { type: string, format: date-time }

    CompanionPostResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        game: { $ref: '#/components/schemas/GameResponse' }
        authorNickname: { type: string }
        capacity: { type: integer }
        confirmedCount: { type: integer }
        status: { type: string, enum: [OPEN, FULL, CLOSED, ENDED] }

    CompanionPostDetail:
      allOf:
        - $ref: '#/components/schemas/CompanionPostResponse'
        - type: object
          properties:
            intro: { type: string, nullable: true }
            confirmedMembers:
              type: array
              items:
                type: object
                properties:
                  nickname: { type: string }
                  seq: { type: integer }
                  isAuthor: { type: boolean }
            myStatus:
              type: string
              enum: [NONE, CONFIRMED, AUTHOR]
              description: 클라이언트 버튼 상태 결정용

    GameUpsertRequest:
      type: object
      required: [seasonYear, startAt, stadiumId, homeTeamId, awayTeamId]
      properties:
        seasonYear: { type: integer }
        startAt: { type: string, format: date-time }
        stadiumId: { type: integer, format: int64 }
        homeTeamId: { type: integer, format: int64 }
        awayTeamId: { type: integer, format: int64 }
        homeScore: { type: integer, nullable: true }
        awayScore: { type: integer, nullable: true }
        status:
          type: string
          enum: [SCHEDULED, IN_PROGRESS, FINISHED, CANCELED, SUSPENDED]

    GameRevisionResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        beforeStatus: { type: string, nullable: true }
        beforeHomeScore: { type: integer, nullable: true }
        beforeAwayScore: { type: integer, nullable: true }
        afterStatus: { type: string }
        afterHomeScore: { type: integer, nullable: true }
        afterAwayScore: { type: integer, nullable: true }
        reason: { type: string }
        revisedBy: { type: string, description: 운영자 닉네임 }
        revisedAt: { type: string, format: date-time }
