openapi: 3.0.3
info:
  title: 오늘의직관 API
  description: |
    오늘의직관 — KBO 직관 기록 서비스의 REST API 명세서.

    - 작성자: 이채목
    - 작성일: 2026-08-18
    - 최종 수정일: 2026-08-19

    ### 개정 이력
    | 버전 | 일자 | 내용 |
    |---|---|---|
    | v0.1 | 2026-08-18 | 초안. 회원 · 경기 · 직관 기록 · 전적 엔드포인트 작성 |
    | v0.2 | 2026-08-18 | 직관 메이트, 관람 계획, 운영 엔드포인트 추가 |
    | v0.3 | 2026-08-19 | 사용자 제보 기반 결과 확정 엔드포인트 삭제. 경기 결과 정정은 운영자 전용으로 정리 |
    | v0.4 | 2026-08-19 | Swagger Editor 에서 열리지 않던 오류 수정. 중복된 operation 키와 따옴표 없는 흐름 매핑이 원인이었다 |
    | v1.0 | 2026-08-19 | 운영 서버 주소를 todayjikgwan.site 로 지정. 모든 오퍼레이션에 설명 추가 |
    | v1.1 | 2026-08-19 | 각 오퍼레이션에 `x-scope` 로 MVP · 확장 범위를 표시 |

    ### 경기 데이터 출처
    경기 결과는 **운영자만 등록·정정한다** (REQ-F-601, REQ-NF-015). 일반 사용자의 입력이
    경기 결과에 반영되는 경로는 두지 않는다. 외부 API 도입 여부는 이용 조건을 확인한 뒤
    정하기로 했고, 데이터 제공 인터페이스로 추상화해 선택을 미뤄 두었다 (REQ-F-107).
    외부 데이터를 도입하면 서버가 배치로 동기화하며, 클라이언트 요청이 외부로 직접
    전달되지 않는다 (REQ-NF-016). 응답에 포함된 외부 데이터에는 `dataSource` 로
    제공처를 표기한다 (REQ-NF-014). 현재 표기 대상은 날씨(기상청)뿐이다.

    ### 공통 규칙
    - 인증이 필요한 API는 `Authorization: Bearer {accessToken}` 헤더를 요구한다.
    - 모든 오류 응답은 `ErrorResponse` 형식을 따른다.
    - 목록 조회는 `page`, `size` 쿼리 파라미터를 사용한다 (page는 0부터).
  version: 1.0.0
  contact:
    name: 이채목

servers:
  - url: https://api.todayjikgwan.site/api/v1
    description: 운영 서버 (도메인 취득 예정)
  - url: http://localhost:8080/api/v1
    description: 로컬 개발 서버

tags:
  - name: Auth
    description: 인증 (REQ-F-001 ~ 004, REQ-F-009)
  - name: User
    description: 회원 정보 (REQ-F-005 ~ 008)
  - name: Game
    description: 경기 정보 (REQ-F-101 ~ 107, REQ-F-112 ~ 113)
  - name: Stadium
    description: 구장 및 구역별 만족도 (REQ-F-108 ~ 111, REQ-F-114)
  - name: AttendanceLog
    description: 직관 기록 (REQ-F-201 ~ 216)
  - name: Stat
    description: 전적 집계 (REQ-F-301 ~ 310)
  - name: Companion
    description: 직관 메이트 모집 (REQ-F-501 ~ 507)
  - name: CompanionChat
    description: 메이트 소통 (REQ-F-510 ~ 513)
  - name: Safety
    description: 신고 · 차단 (REQ-F-508, REQ-F-509)
  - name: ViewingPlan
    description: 관람 계획 (REQ-F-401 ~ 404)
  - name: Notification
    description: 알림 (REQ-F-706 ~ 707)
  - name: Admin
    description: 운영자 기능 (REQ-F-601 ~ 606)

security:
  - bearerAuth: []

paths:
  # ==================== Auth ====================
  /auth/signup:
    post:
      x-scope: MVP
      tags: [Auth]
      summary: 이메일 회원가입
      description: REQ-F-001. 가입 후 인증 메일을 발송한다. 인증 링크 유효기간은 30분이다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, nickname]
              properties:
                email:
                  type: string
                  format: email
                  example: fan@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: 8자 이상, 영문/숫자/특수문자 중 2종 이상
                nickname:
                  type: string
                  maxLength: 30
                  example: 잠실단골
                favoriteTeamId:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        '201':
          description: 가입 성공. 인증 메일 발송됨
        '409':
          description: 이메일 또는 닉네임 중복
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                code: DUPLICATE_EMAIL
                message: 이미 사용 중인 이메일입니다.
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/login:
    post:
      x-scope: MVP
      tags: [Auth]
      summary: 이메일 로그인
      description: REQ-F-002. 비밀번호 5회 연속 실패 시 캡차 토큰을 요구한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                captchaToken:
                  type: string
                  nullable: true
                  description: 5회 이상 실패한 계정에서만 필수
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: 계정 정보 불일치. 이메일/비밀번호 중 무엇이 틀렸는지 구분하지 않는다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                code: INVALID_CREDENTIALS
                message: 이메일 또는 비밀번호가 올바르지 않습니다.
        '403':
          description: 이메일 미인증 또는 캡차 필요
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                code: CAPTCHA_REQUIRED
                message: 캡차 인증이 필요합니다.

  /auth/oauth/providers:
    get:
      x-scope: 확장
      tags: [Auth]
      summary: 사용 가능한 소셜 로그인 제공자 조회
      description: |
        REQ-F-003. 서버에 클라이언트 키가 등록된 제공자만 반환한다.
        화면은 이 목록대로 버튼을 그리므로, 키를 발급받지 않은 제공자는 버튼 자체가 뜨지 않는다.
      security: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    provider: { type: string, enum: [google, naver, kakao], example: google }
                    displayName: { type: string, example: 구글 }

  /auth/oauth/{provider}/authorize-url:
    get:
      x-scope: 확장
      tags: [Auth]
      summary: 소셜 로그인 인가 URL 발급
      description: |
        REQ-F-003. 제공자의 동의 화면 URL과 `state`를 함께 반환한다.
        클라이언트는 `state`를 보관했다가 콜백에서 대조해, 이 브라우저에서 시작하지 않은 응답을 거른다.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, naver, kakao] } }
      responses:
        '200':
          description: 발급 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizeUrl: { type: string, example: 'https://accounts.google.com/o/oauth2/v2/auth?...' }
                  state: { type: string, example: x61DhMndc_Jl4k0bG5pDdydgfPVQoTGR }
        '400':
          description: 키가 등록되지 않은 제공자 (OAUTH_PROVIDER_DISABLED)

  /auth/oauth/{provider}/callback:
    post:
      x-scope: 확장
      tags: [Auth]
      summary: 소셜 로그인 콜백 (인가 코드 교환)
      description: |
        REQ-F-003. 인가 코드를 액세스 토큰으로 바꾸고 프로필을 조회한 뒤 서비스 토큰을 발급한다.
        클라이언트 시크릿이 필요하므로 교환과 프로필 조회는 모두 서버에서 수행한다.

        계정은 이메일이 아니라 **(provider, providerUserId)** 로 식별한다. 카카오는 이메일 제공이
        비즈앱 심사 대상이라 내려오지 않을 수 있고, 이메일은 제공자 쪽에서 변경될 수도 있기 때문이다.
        이메일이 함께 제공되고 그 이메일로 가입한 계정이 이미 있으면 해당 계정에 연동한다.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, naver, kakao] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 제공자가 리다이렉트로 넘긴 인가 코드 }
                state: { type: string }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - type: object
                    properties:
                      newAccount: { type: boolean, example: false }
                      nickname: { type: string, example: 잠실단골 }
                      needsFavoriteTeam:
                        type: boolean
                        description: true 이면 응원팀 선택 화면으로 보낸다 (전적 판정 기준이 된다)
                        example: true
        '401':
          description: 코드 교환 또는 프로필 조회 실패 (OAUTH_FAILED)

  /auth/password-reset:
    post:
      x-scope: 확장
      tags: [Auth]
      summary: 비밀번호 재설정 메일 발송
      description: |
        > **현재 미구현.** 메일 발송 경로를 확보하지 못해 다음 범위로 미뤘다.

        REQ-F-004. 가입되지 않은 이메일이어도 계정 존재 여부를 노출하지 않기 위해 동일하게 200을 반환한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: 요청 접수됨

  # ==================== User ====================
  /users/me:
    get:
      x-scope: 확장
      tags: [User]
      summary: 내 정보 조회
      description: REQ-F-006. 닉네임, 응원팀, 연결된 소셜 계정, 권한을 함께 반환한다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      x-scope: MVP
      tags: [User]
      summary: 내 정보 수정
      description: REQ-F-005, REQ-F-006. 응원팀 변경 시 변경 이력을 기록하며, **이미 작성된 관람 기록의 승패 판정에는 소급 적용하지 않는다.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, maxLength: 30 }
                favoriteTeamId: { type: integer, format: int64 }
                profileImageUrl: { type: string }
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '409':
          description: 닉네임 중복

  /users/me/badges:
    get:
      x-scope: 확장
      tags: [User]
      summary: 내 배지 목록
      description: REQ-F-703
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BadgeResponse' }

  /teams:
    get:
      x-scope: MVP
      tags: [User]
      summary: 구단 목록
      description: REQ-F-005. 응원팀 선택지로 쓴다. 운영이 중단된 구단은 제외한다.
      security: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int64, example: 2 }
                    name: { type: string, example: LG 트윈스 }
                    shortName: { type: string, example: LG }

  # ==================== Notification ====================
  /notifications:
    get:
      x-scope: 확장
      tags: [Notification]
      summary: 알림 목록
      description: REQ-F-706. 미읽음 개수를 함께 반환해 헤더 배지에 쓴다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreadCount: { type: integer, example: 3 }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        type: { type: string, enum: [BADGE, COMPANION_CONFIRMED, GAME_REVISED] }
                        title: { type: string, example: 경기 결과가 정정됐어요 }
                        body: { type: string, example: 8월 8일 LG vs 삼성 결과 변경으로 전적이 갱신됐습니다 }
                        linkUrl: { type: string, example: /stats }
                        read: { type: boolean }
                        createdAt: { type: string, format: date-time }

  /notifications/read:
    put:
      x-scope: 확장
      tags: [Notification]
      summary: 알림 전체 읽음 처리
      description: REQ-F-707
      responses:
        '204':
          description: 처리 완료

  # ==================== Game ====================
  /games:
    get:
      x-scope: MVP
      tags: [Game]
      summary: 경기 일정 및 결과 조회
      description: REQ-F-101, REQ-F-102. 날짜 미지정 시 당일 기준으로 조회한다.
      security: []
      parameters:
        - { name: date, in: query, schema: { type: string, format: date }, example: '2026-08-18' }
        - { name: teamId, in: query, schema: { type: integer, format: int64 } }
        - { name: stadiumId, in: query, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: { $ref: '#/components/schemas/GameResponse' }
                  dataSource:
                    type: string
                    description: REQ-NF-014 출처 표기
                    example: 'TheSportsDB'
                  syncedAt:
                    type: string
                    format: date-time
                    description: REQ-F-106 마지막 동기화 시각
                  stale:
                    type: boolean
                    description: REQ-NF-010 동기화 실패로 마지막 성공 데이터를 반환한 경우 true
                    example: false

  /games/{gameId}:
    get:
      x-scope: MVP
      tags: [Game]
      summary: 경기 상세 조회
      description: |
        > **현재 미구현.** 일자별 목록(`GET /games`)이 상세에 필요한 값을 모두 담고 있어
        > 화면이 단건 조회를 쓰지 않는다.

        REQ-F-103
      security: []
      parameters:
        - { name: gameId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /games/suggest:
    post:
      x-scope: 확장
      tags: [Game]
      summary: 촬영 일시 기반 경기 후보 조회
      description: |
        > **현재 미구현.** 운영자 등록(REQ-F-601)으로 경기 데이터가 채워지고 있어 우선순위를 낮췄다.

        REQ-F-204. 업로드한 사진의 촬영 일시로 해당 일자의 경기를 후보로 반환한다.
        촬영 일시가 없거나 해당일 경기가 없으면 빈 배열을 반환하며, 클라이언트는 수동 선택으로 전환한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [takenAt]
              properties:
                takenAt: { type: string, format: date-time }
      responses:
        '200':
          description: 후보 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GameResponse' }

  /games/{gameId}/weather:
    get:
      x-scope: 확장
      tags: [Game]
      summary: 경기 구장 날씨 조회
      description: |
        REQ-F-112. 경기 시작 시각 기준 구장 날씨를 반환한다.
        기상청 단기예보 API 결과를 서버가 배치로 동기화한 값이며, 예보 범위를 벗어난 경기는 null 을 반환한다.
      security: []
      parameters:
        - { name: gameId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeatherResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /games/weather/sync:
    post:
      x-scope: 확장
      tags: [Game]
      summary: 구장 날씨 수동 동기화
      description: |
        REQ-F-112. 기상청 단기예보를 즉시 받아와 갱신한다. 평소에는 스케줄러가
        하루 네 번(02·08·14·20시) 수행하므로, 이 엔드포인트는 예보가 갱신된 직후
        바로 반영해야 할 때만 쓴다. 운영자 권한이 필요하다.
      responses:
        '200':
          description: 동기화 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer, description: '갱신된 경기 수', example: 15 }
        '403': { $ref: '#/components/responses/Forbidden' }

  /standings:
    get:
      x-scope: 확장
      tags: [Game]
      summary: 팀 순위 조회
