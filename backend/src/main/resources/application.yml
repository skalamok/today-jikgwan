spring:
  application:
    name: today-jikgwan

  datasource:
    url: jdbc:postgresql://localhost:5433/todayjikgwan
    username: todayjikgwan
    password: todayjikgwan

  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 Flyway가 관리한다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 60MB

server:
  port: 8080

todayjikgwan:
  jwt:
    # 로컬 개발용 시크릿. 운영에서는 환경변수로 주입한다
    secret: ${JIKGWAN_JWT_SECRET:today-jikgwan-local-dev-secret-key-must-be-at-least-32-bytes}
    access-token-seconds: 3600
  storage:
    # 업로드 파일 저장 경로. 운영에서는 오브젝트 스토리지로 교체한다
    base-dir: ./uploads
    public-base-url: /uploads
    max-photos-per-log: 10          # REQ-F-203
    max-file-size-bytes: 10485760   # 10MB
    thumbnail-max-px: 400           # REQ-N-002

  stat:
    # REQ-F-305 소표본 표시 기준. 이 값 미만이면 승률을 산출하지 않는다
    small-sample-threshold: 5
  game-report:
    # REQ-F-607 동일 스코어 제보가 이 수 이상 일치하면 결과를 확정한다
    confirm-threshold: 3
  # 운영자로 지정할 계정 이메일(쉼표 구분). 이미 가입한 계정만 승격된다.
  admin-emails: ${JIKGWAN_ADMIN_EMAILS:}

  oauth:
    # 인증 후 브라우저가 돌아올 프런트엔드 주소. 각 제공자 콘솔에도 같은 값을 등록해야 한다.
    redirect-uri: ${JIKGWAN_OAUTH_REDIRECT_URI:http://localhost:5173/oauth/{provider}}
    # 키를 넣지 않은 제공자는 /auth/oauth/providers 에서 빠지고 로그인 화면에도 버튼이 뜨지 않는다.
    providers:
      google:
        client-id: ${JIKGWAN_GOOGLE_CLIENT_ID:}
        client-secret: ${JIKGWAN_GOOGLE_CLIENT_SECRET:}
      naver:
        client-id: ${JIKGWAN_NAVER_CLIENT_ID:}
        client-secret: ${JIKGWAN_NAVER_CLIENT_SECRET:}
      kakao:
        client-id: ${JIKGWAN_KAKAO_CLIENT_ID:}
        client-secret: ${JIKGWAN_KAKAO_CLIENT_SECRET:}

  external:
    kma:
      # 공공데이터포털 기상청 단기예보 · 기상특보 (REQ-N-024)
      # 인증키는 환경변수로 주입한다. 소스에 넣지 않는다.
      service-key: ${JIKGWAN_KMA_SERVICE_KEY:}
      forecast-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst
      alert-url: https://apis.data.go.kr/1360000/WthrWrnInfoService/getPwnStatus
      # REQ-F-113 이 값 이상이면 우천 가능성을 안내한다
      rain-risk-threshold: 60
      # REQ-N-016 하루 4회 배치
      sync-cron: "0 10 2,8,14,20 * * *"
    thesportsdb:
      base-url: https://www.thesportsdb.com/api/v1/json
      api-key: "123"          # 무료 공용 테스트 키. 운영 시 전용 키로 교체 (REQ-N-017)
      league-id: "4830"
      # REQ-N-016 분당 30회 한도
      rate-limit-per-minute: 30

logging:
  level:
    org.hibernate.SQL: debug

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    properties:
      hibernate:
        highlight_sql: true
