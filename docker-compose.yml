services:
  postgres:
    image: postgres:18
    container_name: todayjikgwan-db
    environment:
      POSTGRES_DB: todayjikgwan
      POSTGRES_USER: todayjikgwan
      POSTGRES_PASSWORD: todayjikgwan
      TZ: Asia/Seoul
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18+ 는 /var/lib/postgresql 하위에 메이저 버전별 디렉터리를 만든다
      - todayjikgwan-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todayjikgwan -d todayjikgwan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  todayjikgwan-pgdata:
